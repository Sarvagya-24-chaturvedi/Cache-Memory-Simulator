name: CI & Deployment Verification

on:
  push:
    branches: [ main, feature/deploy-app ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Icarus Verilog)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Install Python Dependencies
        run: |
          cd cms
          pip install -r requirements.txt

      - name: Run Backend Unit Tests
        run: |
          cd cms
          python -m unittest discover -s tests

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          cd cms
          docker build -t cache-simulator:latest .
